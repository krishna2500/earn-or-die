name: earn-or-die

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync latest state before cycle
        run: git pull --rebase origin main || true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run agent cycle
        id: agent
        continue-on-error: true
        run: |
          set +e
          node agent/core.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_OWNER_CHAT: ${{ secrets.TG_OWNER_CHAT }}

      - name: Persist state + opportunities
        run: |
          git config user.name "earn-or-die-agent"
          git config user.email "earn-or-die-agent@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "agent: cycle ${{ github.run_number }}"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            sleep 5
          done
          echo "push failed after 3 retries (remote moved mid-cycle)"
          exit 1

      - name: "Self-destruct: ONLY when agent exits 2 (DEAD)"
        if: steps.agent.outputs.code == '2'
        run: |
          rm -f .github/workflows/agent.yml
          git add -A
          git diff --cached --quiet || git commit -m "agent: DEAD after earning nothing — deleting own cron"
          git push || true
