name: scout

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync latest state
        run: git pull --rebase origin main || true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fast bounty scout (bounties arm only)
        id: scout
        continue-on-error: true
        run: |
          set +e
          FAST_ARM=bounties node agent/core.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_OWNER_CHAT: ${{ secrets.TG_OWNER_CHAT }}

      - name: Persist new findings
        run: |
          git config user.name "earn-or-die-agent"
          git config user.email "earn-or-die-agent@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes (quiet scout)"
            exit 0
          fi
          git commit -m "scout: bounty scan ${{ github.run_number }}"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            sleep 5
          done
          echo "push failed after 3 retries"
          exit 1
